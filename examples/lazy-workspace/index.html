<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lazy workspace · Runway UI</title>
    <link rel="stylesheet" href="../../dist/runway-ui.css" />
    <link rel="stylesheet" data-href="panel.css" id="panel-style" />
    <style>
      body {
        margin: 0;
        padding: clamp(16px, 4vw, 40px);
        background: var(--rw-bg);
        font: 14px / 1.6 var(--rw-font);
      }
      main {
        max-inline-size: 720px;
        margin-inline: auto;
        display: grid;
        gap: 18px;
      }
      h1,
      p {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #open {
        justify-self: start;
      }
    </style>
  </head>
  <body class="rw-ui">
    <main class="rw-panel">
      <h1>Orbital supply desk</h1>
      <p>A small host-owned simulation using optional Runway behaviors.</p>
      <button type="button" class="rw-button" id="open">Open supply panel</button>
      <section id="panel" aria-live="polite"></section>
      <p role="status" id="status"></p>
    </main>
    <script type="module" src="app.ts"></script>
  </body>
</html>
