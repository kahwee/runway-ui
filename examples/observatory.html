<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Simulation Observatory · Runway UI</title>
    <link rel="stylesheet" href="../dist/runway-ui.css">
    <style>
    body {
      margin: 0;
      background: var(--rw-bg);
      padding: 28px;
      font-family: var(--rw-font);
    }
    .example-nav {
      max-inline-size: 1520px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      gap: 20px;
    }
    .example-nav a {
      color: var(--rw-accent);
      text-underline-offset: 3px;
    }
    </style>
  </head>
  <body class="rw-ui" data-skin="play">
    <nav class="example-nav">
      <a href="../docs/"
        ><span class="rw-icon" data-icon="arrow-left" aria-hidden="true"></span>
        Runway UI</a
      ><a href="../storybook/?path=/story/compositions-simulation-observatory--playground"
        >Explore the Storybook arguments
        <span class="rw-icon" data-icon="arrow-up-right" aria-hidden="true"></span></a
      >
    </nav>
    <main id="observatory"></main>
    <script type="module">
    import { bindObservatory } from "./observatory/controller.js";
    import { renderObservatory } from "./observatory/render.js";

    const { root, data } = renderObservatory();
    document.querySelector("#observatory").append(root);
    const controller = bindObservatory(root, data);
    addEventListener("pagehide", () => controller.destroy(), { once: true });
    </script>
  </body>
</html>
