name: npm release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: npm-release-${{ startsWith(github.ref, 'refs/tags/') && 'tags' || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.identity.outputs.version }}
      dist-tag: ${{ steps.identity.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: bun install --frozen-lockfile
      - id: identity
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: bun scripts/release-package.ts identity
      - name: Require tagged source on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      - run: bun check
      - run: bun run test-behaviors
      - run: bun run build-site
      - run: bun run check-generated
      - run: bun run check-docs
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run check-pages
      - name: Build and verify the package consumers will install
        run: |
          mkdir -p .release
          bun pm pack --ignore-scripts --filename .release/package.tgz
          bun scripts/release-package.ts archive .release/package.tgz
          cd .release
          sha256sum package.tgz > package.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: |
            .release/package.tgz
            .release/package.sha256
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: npm install --global npm@12.2.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: .release
      - name: Publish the tested bytes using npm trusted publishing
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
        run: |
          set -euo pipefail
          cd .release
          sha256sum -c package.sha256
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const version = process.env.RELEASE_VERSION;
          const tag = process.env.RELEASE_DIST_TAG;
          assert.match(version, /^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(tag, version.includes('-') ? 'next' : 'latest');
          const response = await fetch(`https://registry.npmjs.org/@kahwee%2Frunway-ui/${encodeURIComponent(version)}`);
          assert.equal(response.status, 404, 'Version already exists or registry could not verify availability');
          JS
          npm publish package.tgz --ignore-scripts --access public --provenance --tag "$RELEASE_DIST_TAG" --registry https://registry.npmjs.org/
          npm view "@kahwee/runway-ui@$RELEASE_VERSION" version dist.integrity --json --registry https://registry.npmjs.org/
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFile} from 'node:fs/promises';
          const root = 'https://registry.npmjs.org/@kahwee%2Frunway-ui';
          const response = await fetch(`${root}/${encodeURIComponent(process.env.RELEASE_VERSION)}`);
          assert.equal(response.status, 200);
          const published = await response.json();
          assert.equal(published.version, process.env.RELEASE_VERSION);
          assert.equal(published.dist.integrity, 'sha512-' + createHash('sha512').update(await readFile('package.tgz')).digest('base64'));
          const packageResponse = await fetch(root);
          assert.equal(packageResponse.status, 200);
          assert.equal((await packageResponse.json())['dist-tags'][process.env.RELEASE_DIST_TAG], process.env.RELEASE_VERSION);
          JS
