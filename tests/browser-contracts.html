<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Behavior contracts · Runway UI</title>
    <link rel="stylesheet" href="../dist/runway-ui.css" />
  </head>
  <body class="rw-ui">
    <main class="rw-panel">
      <h1>Native behavior contracts</h1>
      <p id="result" role="status">Running…</p>
    </main>
    <script type="module">
      import { runBehaviorContracts } from "./browser-contracts.js";

      const result = document.querySelector("#result");
      try {
        const receipt = await runBehaviorContracts();
        result.textContent = `${receipt.modules} modules passed · ${receipt.browser}`;
        result.dataset.result = "passed";
      } catch (error) {
        result.textContent = String(error);
        result.dataset.result = "failed";
        throw error;
      }
    </script>
  </body>
</html>
