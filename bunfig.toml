[install]
# Preserve the existing Vite release-age exception; no formatter packages remain.
minimumReleaseAgeExcludes = ["vite@8.3.5"]

[fmt]
printWidth = 100
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
trailingComma = "all"
# Generated artifacts have their own build/check-generated verification.
# Markdown and workflow files were outside the previous source formatter scope.
ignorePatterns = ["dist/", "styles/icons.css", "behaviors/*.d.ts", "react/*.d.ts", "bun.lock", "**/*.md", "**/*.yml", "**/*.yaml", "**/*.toml"]
